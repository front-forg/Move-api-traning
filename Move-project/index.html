<!DOCTYPE html>
<html lang="ru">
    <head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmBox</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <script src="api/api.js" defer></script>
</head>
<body>
    <header class="heading">
        <h1 class="header_title">FilmBox - Удобный и бесплатный</h1>

        <button id="themeToggle">Сменить тему</button>
        <button id="favorites-btn">Избранное (0)</button>

        <div class="search">
            <h2>Поиск</h2>
            <div class="search_controls">
                <input type="text" id="film-input" placeholder="Введите название...">
                <button id="search-btn">Найти</button>
            </div>
        </div>
    </header>

    <div id="Films-result"></div>
</body> 
</html>
